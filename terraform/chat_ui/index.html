<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SOC Copilot Chat</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #1e1e2f;
      color: #eee;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      color: #00d1b2;
      margin-bottom: 1rem;
    }

    #chat {
      border: 1px solid #555;
      border-radius: 10px;
      background: #2b2b3c;
      width: 100%;
      max-width: 800px;
      height: 600px;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .message {
      padding: 0.75rem 1rem;
      border-radius: 12px;
      max-width: 85%;
      word-wrap: break-word;
      display: flex;
      flex-direction: column;
    }

    .user {
      background: #007bff;
      color: #fff;
      align-self: flex-end;
    }

    .bot {
      background: #00d1b2;
      color: #000;
      align-self: flex-start;
      white-space: pre-wrap;
      font-size: 0.92rem;
      line-height: 1.6;
    }

    .timestamp {
      font-size: 0.7rem;
      color: #aaa;
      margin-top: 2px;
      text-align: right;
    }

    #inputContainer {
      display: flex;
      width: 100%;
      max-width: 800px;
    }

    #queryInput {
      flex: 1;
      padding: 0.6rem 1rem;
      border-radius: 10px;
      border: 1px solid #555;
      background: #2b2b3c;
      color: #eee;
    }

    #sendBtn {
      padding: 0.6rem 1rem;
      margin-left: 0.5rem;
      border-radius: 10px;
      background: #00d1b2;
      color: #000;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    #sendBtn:hover {
      background: #00f2c2;
    }

    .typing {
      font-style: italic;
      color: #888;
    }

    #authBar {
      width: 100%;
      max-width: 800px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
      color: #aaa;
    }

    #authBar button {
      padding: 0.35rem 0.8rem;
      border-radius: 8px;
      border: 1px solid #555;
      background: #2b2b3c;
      color: #eee;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>SOC Copilot Chat</h1>

  <div id="authBar">
    <span id="userLabel"></span>
    <button id="loginBtn" style="display:none">Log in</button>
    <button id="logoutBtn" style="display:none">Log out</button>
  </div>

  <div id="chat"></div>

  <div id="inputContainer">
    <input type="text" id="queryInput" placeholder="Ask SOC Copilot...">
    <button id="sendBtn">Send</button>
  </div>

  <!-- config.js is generated by Terraform (Cognito settings + API endpoint) -->
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
